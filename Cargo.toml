[workspace]
resolver = "2"
members = [
    "contracts/types",
    "contracts/kite",
    "contracts/factory",
    "tests/integration",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Kite-01/stellar-contracts"

[workspace.dependencies]
soroban-sdk = "=29.0.1"
kite-types = { package = "types", path = "contracts/types" }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = 0
strip = "symbols"
panic = "abort"
overflow-checks = true
debug-assertions = false

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
